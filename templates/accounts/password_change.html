{% extends 'base.html' %}

{% block title %}Change Password - ANNA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-key"></i> Change Password</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                {% for field in form %}
                    {% include "components/form_field.html" with field=field %}
                {% endfor %}
                    <button type="submit" class="btn btn-anna w-100">
                        <i class="bi bi-check-circle"></i> Change Password
                    </button>
                </form>
            </div>
            <div class="card-footer bg-transparent text-center">
                <a href="{% url 'dashboard:settings' %}" class="text-muted">
                    <i class="bi bi-arrow-left"></i> Back to Settings
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
